name: Build and Test

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: mvn clean package

  test:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Application Test
        run: echo "Testing completed successfully"
