name: Employee Pipeline

on:
  workflow_dispatch:

jobs:

  Build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Project
        run: mvn clean package

      - name: Run Application
        run: java -cp target/classes employee.management.main_file

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: target/*.jar

  test:

    needs: Build

    runs-on: ubuntu-latest

    steps:

      - name: Employee Validation
        run: echo "Employee Validation Successful"

  deploy:

    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Run Application
        run: java -cp target/classes example.com.javacode

      - name: Deploy Application
        run: echo "Employee Deployment Successful"
