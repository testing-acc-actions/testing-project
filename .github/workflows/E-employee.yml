name: Employee Pipeline

on:
  workflow_dispatch:

jobs:

  Build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: mvn clean package

  test:

    needs: Build

    runs-on: ubuntu-latest

    steps:

      - name: Employee Validation
        run: echo "Employee Validation Successful"

  deploy:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Deploy Application
        run: echo "Employee Deployment Successful"

      - name: Run Application
        run: java -cp target/classes employee.management.main-file
      
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: target/*.jar
