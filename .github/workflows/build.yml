name: Production Build yml

on:
  push:
    branches:
      - main

jobs:

  build_yml:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: mvn clean package

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: target/*.jar
